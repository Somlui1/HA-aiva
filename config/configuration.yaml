        target_temperature: "{{ states('input_number.eminent_ac_zs05_temp') | int(25) }}"
        current_temperature: "{{ states('input_number.eminent_ac_zs05_temp') | int(25) }}"
        set_hvac_mode:
          - action: input_select.select_option
            target:
              entity_id: input_select.eminent_ac_zs05_mode
            data:
              option: "{{ hvac_mode }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ hvac_mode == 'off' }}"
                sequence:
                  - action: remote.send_command
                    target:
                      entity_id: remote.zs05_zigbee_ir
                    data:
                      device: eminent
                      command: power_off
              - conditions:
                  - condition: template
                    value_template: "{{ hvac_mode == 'cool' }}"
                sequence:
                  - action: remote.send_command
                    target:
                      entity_id: remote.zs05_zigbee_ir
                    data:
                      device: eminent
                      command: "cool_{{ states('input_number.eminent_ac_zs05_temp') | int(25) }}"
        set_temperature:
          - action: input_number.set_value
            target:
              entity_id: input_number.eminent_ac_zs05_temp
            data:
              value: "{{ temperature }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ states('input_select.eminent_ac_zs05_mode') == 'off' }}"
                sequence:
                  - action: input_select.select_option
                    target:
                      entity_id: input_select.eminent_ac_zs05_mode
                    data:
                      option: "cool"
          - action: remote.send_command
            target:
              entity_id: remote.zs05_zigbee_ir
            data:
              device: eminent
              command: "cool_{{ temperature | int }}"

      # ------------------------------------------------------------------------
      # [3] Carrier AC (Gateway IR) -> climate.carrier_ac
      # ------------------------------------------------------------------------
      - name: "Carrier AC"
        unique_id: carrier_ac
        hvac_modes: "off, cool"
        min_temperature: 17
        max_temperature: 30
        target_temperature_step: 1
        hvac_mode: "{{ states('input_select.carrier_ac_mode') }}"
        target_temperature: "{{ states('input_number.carrier_ac_temp') | int(25) }}"
        current_temperature: "{{ states('input_number.carrier_ac_temp') | int(25) }}"
        set_hvac_mode:
          - action: input_select.select_option
            target:

# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Input Helpers (for manual template devices)
input_select:
  carrier_ac_mode:
    name: "Carrier AC Mode"
    options:
      - "off"
      - "cool"
    initial: "off"
    icon: mdi:air-conditioner

  eminent_ac_mode:
    name: "Eminent AC Mode"
    options:
      - "off"
      - "cool"
    initial: "off"
    icon: mdi:air-conditioner

input_number:
  carrier_ac_temp:
    name: "Carrier AC Target Temp"
    min: 18
    max: 30
    step: 1
    initial: 25
    unit_of_measurement: "°C"
    icon: mdi:thermometer

  eminent_ac_temp:
    name: "Eminent AC Target Temp"
    min: 15
    max: 30
    step: 1
    initial: 25
    unit_of_measurement: "°C"
    icon: mdi:thermometer

template:
  - climate:
      # ==========================================
      # 1. Carrier AC (Manual Template)
      # ==========================================
      - name: "Carrier AC"
        unique_id: carrier_ac
        hvac_modes: "off, cool"
        min_temperature: 18
        max_temperature: 30
        target_temperature_step: 1
        hvac_mode: "{{ states('input_select.carrier_ac_mode') }}"
        target_temperature: "{{ states('input_number.carrier_ac_temp') | float(25) }}"
        current_temperature: "{{ states('input_number.carrier_ac_temp') | float(25) }}"
        set_hvac_mode:
          - action: input_select.select_option
            target:
              entity_id: input_select.carrier_ac_mode
            data:
              option: "{{ hvac_mode }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ hvac_mode == 'off' }}"
                sequence:
                  - action: remote.send_command
                    target:
                      entity_id: remote.tunya_gateway_ir
                    data:
                      device: carrier
                      command: power_off
              - conditions:
                  - condition: template
                    value_template: "{{ hvac_mode == 'cool' }}"
                sequence:
                  - action: remote.send_command
                    target:
                      entity_id: remote.tunya_gateway_ir
                    data:
                      device: carrier
                      command: "cool_{{ states('input_number.carrier_ac_temp') | int(25) }}"
        set_temperature:
          - action: input_number.set_value
            target:
              entity_id: input_number.carrier_ac_temp
            data:
              value: "{{ temperature }}"
          - action: input_select.select_option
            target:
              entity_id: input_select.carrier_ac_mode
            data:
              option: "cool"
          - action: remote.send_command
            target:
              entity_id: remote.tunya_gateway_ir
            data:
              device: carrier
              command: "cool_{{ temperature | int }}"

      # ==========================================
      # 2. Eminent AC (Meeting Room 1 - A06-RM-HS0INT-0506)
      # ==========================================
      - name: "Eminent AC"
        unique_id: eminent_gateway_ac
        hvac_modes: "off, cool"
        min_temperature: 15
        max_temperature: 30
        target_temperature_step: 1
        hvac_mode: "{{ states('input_select.eminent_ac_mode') }}"
        target_temperature: "{{ states('input_number.eminent_ac_temp') | int(25) }}"
        current_temperature: "{{ states('input_number.eminent_ac_temp') | int(25) }}"
        set_hvac_mode:
          - action: input_select.select_option
            target:
              entity_id: input_select.eminent_ac_mode
            data:
              option: "{{ hvac_mode }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ hvac_mode == 'off' }}"
                sequence:
                  - action: remote.send_command
                    target:
                      entity_id: remote.tunya_gateway_ir
                    data:
                      device: eminent
                      command: power_off
              - conditions:
                  - condition: template
                    value_template: "{{ hvac_mode == 'cool' }}"
                sequence:
                  - action: remote.send_command
                    target:
                      entity_id: remote.tunya_gateway_ir
                    data:
                      device: eminent
                      command: "cool_{{ states('input_number.eminent_ac_temp') | int(25) }}"
        set_temperature:
          - action: input_number.set_value
            target:
              entity_id: input_number.eminent_ac_temp
            data:
              value: "{{ temperature }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ states('input_select.eminent_ac_mode') == 'off' }}"
                sequence:
                  - action: input_select.select_option
                    target:
                      entity_id: input_select.eminent_ac_mode
                    data:
                      option: "cool"
          - action: remote.send_command
            target:
              entity_id: remote.tunya_gateway_ir
            data:
              device: eminent
              command: "cool_{{ temperature | int }}"

# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# ==============================================================================
# 1. INPUT HELPERS (สถานะโหมดและอุณหภูมิของแอร์)
# ==============================================================================
input_select:
  # Eminent AC (Gateway IR)
  eminent_ac_mode:
    name: "Eminent AC Mode"
    options:
      - "off"
      - "cool"
    initial: "off"
    icon: mdi:air-conditioner

  # Eminent AC (ZS05 Zigbee IR)
  eminent_ac_zs05_mode:
    name: "Eminent AC (ZS05) Mode"
    options:
      - "off"
      - "cool"
    initial: "off"
    icon: mdi:air-conditioner

  # Carrier AC (Gateway IR)
  carrier_ac_mode:
    name: "Carrier AC Mode"
    options:
      - "off"
      - "cool"
    initial: "off"
    icon: mdi:air-conditioner

  # Carrier AC (ZS05 Zigbee IR)
  carrier_ac_zs05_mode:
    name: "Carrier AC (ZS05) Mode"
    options:
      - "off"
      - "cool"
    initial: "off"
    icon: mdi:air-conditioner

input_number:
  # Eminent AC (Gateway IR) (15°C - 30°C)
  eminent_ac_temp:
    name: "Eminent AC Target Temp"
    min: 15
    max: 30
    step: 1
    initial: 25
    unit_of_measurement: "°C"
    icon: mdi:thermometer

  # Eminent AC (ZS05 Zigbee IR) (15°C - 30°C)
  eminent_ac_zs05_temp:
    name: "Eminent AC (ZS05) Target Temp"
    min: 15
    max: 30
    step: 1
    initial: 25
    unit_of_measurement: "°C"
    icon: mdi:thermometer

  # Carrier AC (Gateway IR) (17°C - 30°C)
  carrier_ac_temp:
    name: "Carrier AC Target Temp"
    min: 17
    max: 30
    step: 1
    initial: 25
    unit_of_measurement: "°C"
    icon: mdi:thermometer

  # Carrier AC (ZS05 Zigbee IR) (17°C - 30°C)
  carrier_ac_zs05_temp:
    name: "Carrier AC (ZS05) Target Temp"
    min: 17
    max: 30
    step: 1
    initial: 25
    unit_of_measurement: "°C"
    icon: mdi:thermometer

# ==============================================================================
# 2. TEMPLATE CLIMATE PLATFORM
# ==============================================================================
template:
  - climate:
      # ------------------------------------------------------------------------
      # [1] Eminent AC (Gateway IR) -> climate.eminent_ac
      # ------------------------------------------------------------------------
      - name: "Eminent AC"
        unique_id: eminent_ac
        hvac_modes: "off, cool"
        min_temperature: 15
        max_temperature: 30
        target_temperature_step: 1
        hvac_mode: "{{ states('input_select.eminent_ac_mode') }}"
        target_temperature: "{{ states('input_number.eminent_ac_temp') | int(25) }}"
        current_temperature: "{{ states('input_number.eminent_ac_temp') | int(25) }}"
        set_hvac_mode:
          - action: input_select.select_option
            target:
              entity_id: input_select.eminent_ac_mode
            data:
              option: "{{ hvac_mode }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ hvac_mode == 'off' }}"
                sequence:
                  - action: remote.send_command
                    target:
                      entity_id: remote.tunya_gateway_ir
                    data:
                      device: eminent
                      command: power_off
              - conditions:
                  - condition: template
                    value_template: "{{ hvac_mode == 'cool' }}"
                sequence:
                  - action: remote.send_command
                    target:
                      entity_id: remote.tunya_gateway_ir
                    data:
                      device: eminent
                      command: "cool_{{ states('input_number.eminent_ac_temp') | int(25) }}"
        set_temperature:
          - action: input_number.set_value
            target:
              entity_id: input_number.eminent_ac_temp
            data:
              value: "{{ temperature }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ states('input_select.eminent_ac_mode') == 'off' }}"
                sequence:
                  - action: input_select.select_option
                    target:
                      entity_id: input_select.eminent_ac_mode
                    data:
                      option: "cool"
          - action: remote.send_command
            target:
              entity_id: remote.tunya_gateway_ir
            data:
              device: eminent
              command: "cool_{{ temperature | int }}"

      # ------------------------------------------------------------------------
      # [2] Eminent AC (ZS05 IR) -> climate.eminent_ac_zs05_ir
      # ------------------------------------------------------------------------
      - name: "Eminent AC ZS05 IR"
        unique_id: eminent_ac_zs05
        hvac_modes: "off, cool"

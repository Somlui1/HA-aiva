      # ------------------------------------------------------------------------
      # [4] Carrier AC (ZS05 IR) -> climate.carrier_ac_zs05_ir
      # ------------------------------------------------------------------------
      - name: "Carrier AC ZS05 IR"
        unique_id: carrier_ac_zs05
        hvac_modes: "off, cool"
        min_temperature: 17

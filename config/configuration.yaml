# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# ========================================================
# Input Helpers for AC Remote Templates
# ========================================================
input_select:
  # Carrier AC Helpers
  carrier_ac_gw_mode:
    name: "Carrier AC (Gateway) Mode"
    options:
      - "off"
      - "cool"
    initial: "off"
    icon: mdi:air-conditioner

  carrier_ac_zs05_mode:
    name: "Carrier AC (ZS05) Mode"
    options:
      - "off"
      - "cool"
    initial: "off"
    icon: mdi:air-conditioner

  # Eminent AC Helpers
  eminent_ac_gw_mode:
    name: "Eminent AC (Gateway) Mode"
    options:
      - "off"
      - "cool"
    initial: "off"
    icon: mdi:air-conditioner

  eminent_ac_zs05_mode:
    name: "Eminent AC (ZS05) Mode"
    options:
      - "off"
      - "cool"
    initial: "off"
    icon: mdi:air-conditioner

input_number:
  # Carrier AC Helpers (17°C - 30°C)
  carrier_ac_gw_temp:
    name: "Carrier AC (Gateway) Target Temp"
    min: 17
    max: 30
    step: 1
    initial: 25
    unit_of_measurement: "°C"
    icon: mdi:thermometer

  carrier_ac_zs05_temp:
    name: "Carrier AC (ZS05) Target Temp"
    min: 17
    max: 30
    step: 1
    initial: 25
    unit_of_measurement: "°C"
    icon: mdi:thermometer

  # Eminent AC Helpers (15°C - 30°C)
  eminent_ac_gw_temp:
    name: "Eminent AC (Gateway) Target Temp"
    min: 15
    max: 30
    step: 1
    initial: 25
    unit_of_measurement: "°C"
    icon: mdi:thermometer

  eminent_ac_zs05_temp:
    name: "Eminent AC (ZS05) Target Temp"
    min: 15
    max: 30
    step: 1
    initial: 25
    unit_of_measurement: "°C"
    icon: mdi:thermometer

# ========================================================
# Template Climate Devices
# ========================================================
template:
  - climate:
      # ----------------------------------------------------
      # 1. Carrier AC (Gateway IR)
      # ----------------------------------------------------
      - name: "Carrier AC Gateway IR"
        unique_id: carrier_ac_gateway
        hvac_modes: "off, cool"
        min_temperature: 17
        max_temperature: 30
        target_temperature_step: 1
        hvac_mode: "{{ states('input_select.carrier_ac_gw_mode') }}"
        target_temperature: "{{ states('input_number.carrier_ac_gw_temp') | int(25) }}"
        current_temperature: "{{ states('input_number.carrier_ac_gw_temp') | int(25) }}"
        set_hvac_mode:
          - action: input_select.select_option
            target:
              entity_id: input_select.carrier_ac_gw_mode
            data:
              option: "{{ hvac_mode }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ hvac_mode == 'off' }}"
                sequence:
                  - action: remote.send_command
                    target:
                      entity_id: remote.tunya_gateway_ir
                    data:
                      device: carrier
                      command: power_off
              - conditions:
                  - condition: template
                    value_template: "{{ hvac_mode == 'cool' }}"
                sequence:
                  - action: remote.send_command
                    target:
                      entity_id: remote.tunya_gateway_ir
                    data:
                      device: carrier
                      command: "cool_{{ states('input_number.carrier_ac_gw_temp') | int(25) }}"
        set_temperature:
          - action: input_number.set_value
            target:
              entity_id: input_number.carrier_ac_gw_temp
            data:
              value: "{{ temperature }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ states('input_select.carrier_ac_gw_mode') == 'off' }}"
                sequence:
                  - action: input_select.select_option
                    target:
                      entity_id: input_select.carrier_ac_gw_mode
                    data:
                      option: "cool"
          - action: remote.send_command
            target:
              entity_id: remote.tunya_gateway_ir
            data:
              device: carrier
              command: "cool_{{ temperature | int }}"

      # ----------------------------------------------------

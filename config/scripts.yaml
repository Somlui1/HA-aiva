# Scripts configuration file
eminent_ac_power_off:
  alias: "Meeting Room 1: ปิดแอร์ (Power Off)"
  icon: "mdi:power"
  sequence:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.eminent_ac
      data:
        hvac_mode: "off"

eminent_ac_cool_24:
  alias: "Meeting Room 1: เปิดแอร์ 24°C"
  icon: "mdi:snowflake"
  sequence:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.eminent_ac
      data:
        hvac_mode: "cool"
    - action: climate.set_temperature
      target:
        entity_id: climate.eminent_ac
      data:
        temperature: 24

eminent_ac_cool_25:
  alias: "Meeting Room 1: เปิดแอร์ 25°C"
  icon: "mdi:snowflake"
  sequence:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.eminent_ac
      data:
        hvac_mode: "cool"
    - action: climate.set_temperature
      target:
        entity_id: climate.eminent_ac
      data:
        temperature: 25

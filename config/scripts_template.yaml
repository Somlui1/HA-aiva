# ==============================================================================
# TEMPLATE SCRIPTS (ปุ่มลัดสั่งงานแอร์ เช่น สั่งผ่าน Dashboard หรือ Automation)
# ==============================================================================
# หากต้องการสร้างปุ่มลัดสำหรับกดเปิด/ปิดแอร์ทันที สามารถนำตัวอย่างนี้
# ไปวางใน config/scripts.yaml ได้ครับ
# ==============================================================================

# สั่งปิดแอร์ Carrier
carrier_ac_power_off:
  alias: "Carrier AC: ปิดแอร์"
  icon: "mdi:power"
  sequence:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.carrier_ac
      data:
        hvac_mode: "off"

# สั่งเปิดแอร์ Carrier ที่ 25°C
carrier_ac_cool_25:
  alias: "Carrier AC: เปิด 25°C"
  icon: "mdi:snowflake"
  sequence:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.carrier_ac
      data:
        hvac_mode: "cool"
    - action: climate.set_temperature
      target:
        entity_id: climate.carrier_ac
      data:
        temperature: 25

